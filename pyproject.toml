[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ms-core"
version = "0.2.0"
authors = [
  { name="Kirill Ibragimov", email="hexchap@gmail.com" },
]
description = "Core functionality for all the HTTP microservices, used in my projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tortoise-orm[asyncpg]>=0.21.6",
    "fastapi>=0.112.2",
    "makefun>=1.15.4",
    "pytest>=8.4.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
GitHub = "https://github.com/HexChap/MSCore"
Issues = "https://github.com/HexChap/MSCore/issues"

[tool.hatch.build.targets.sdist]
exclude = ["tests/", ".idea/"]

[tool.pyright]
reportIncompatibleVariableOverride = "none"

[dependency-groups]
dev = [
    "aerich>=0.9.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.15",
    "mkdocstrings[python]>=0.29.1",
    "uvicorn>=0.35.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

